# Trivy baseline for the config scan in .github/workflows/trivy.yml.
# The gate fails on any HIGH or CRITICAL finding that is not listed here, so it blocks NEW findings.
# Limit: an entry is per rule and per file, so a new finding of the same rule inside a file listed below is NOT caught.
# Entries need a written reason. Removing an entry turns that finding red again.
misconfigurations:
  - id: KSV-0014
    paths:
      - "ragleap-ops/helm/ragleap-ops/templates/neo4j-deployment.yaml"
      - "ragleap-ops/k8s/neo4j-deployment.yaml"
    statement: "The neo4j container: readOnlyRootFilesystem was live-tested on kind and confirmed unsafe, so it is not enabled (packages/ragleap-ops/CHANGELOG.md). Other containers in these files (for example fix-permissions) were not reviewed individually."
