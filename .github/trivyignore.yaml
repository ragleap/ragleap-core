vulnerabilities:
  - id: CVE-2025-68121
    paths:
      - "usr/local/bin/gosu"
    statement: "gosu, the privilege-dropping helper in the official Postgres images, is built with Go 1.24.6, which carries the crypto/tls CVE-2025-68121 (fixed in Go 1.24.13). Present in postgres:16, postgres:16-alpine and pgvector/pgvector:pg16 on 2026-11-13. Reachability from these images was not assessed. Needs an upstream rebuild; re-check before the expiry, then remove this entry."
    expired_at: 2027-01-12
