name: Java Ansible Resource Parity

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/scripts/java-ansible-parity.sh'
      - '.github/workflows/java-ansible-test.yml'
      - 'java/ragleap-ansible/**'
      - 'packages/ragleap-ansible/**'

permissions:
  contents: read

jobs:
  parity:
    name: Verify Java JAR and Python wheel parity
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Verify parity and break proofs
        env:
          GITHUB_ACTIONS: 'true'
        run: bash .github/scripts/java-ansible-parity.sh
