name: ansible-vm-test

# Runs the ragleap-ansible roles on a REAL host: a GitHub-hosted runner, which is a disposable VM. Base role twice,
# opt-in SSH hardening twice (real reload handler, real systemd), then a real key login against the hardened sshd.
# The script refuses to run anywhere except a GitHub-hosted runner. Manual (workflow_dispatch) or when a PR changes
# this file, the script or the Ansible package. Not a required check.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/ansible-vm-test.yml
      - .github/scripts/ansible-vm-test.sh
      - packages/ragleap-ansible/**

permissions:
  contents: read

jobs:
  ansible-vm-test:
    name: ansible-vm-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Roles on a real host, then a real key login against the hardened sshd
        run: bash .github/scripts/ansible-vm-test.sh
