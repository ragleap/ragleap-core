name: velero-test

# Backup and restore test: Velero with a RustFS S3 stand-in on a throwaway kind cluster, using the ragleap-ops chart.
# Manual (workflow_dispatch, with version inputs) or when a PR changes this file or the test script. Not a required check.
on:
  workflow_dispatch:
    inputs:
      velero_version:
        description: 'Velero version (a very new release can be compared against the previous one)'
        required: false
        default: 'v1.18.3'
      aws_plugin_version:
        description: 'velero-plugin-for-aws version'
        required: false
        default: 'v1.14.0'
      s3_image:
        description: 'S3 stand-in image'
        required: false
        default: 'rustfs/rustfs@sha256:9ca9559533b537d10482fe923288b676ad08f92a7069d9a17327fbae3cab688b'
      cluster:
        description: 'Cluster flavour: kind or k3d (k3s in Docker)'
        required: false
        type: choice
        default: 'kind'
        options:
          - kind
          - k3d
      k3d_version:
        description: 'k3d version (only used when cluster is k3d)'
        required: false
        default: 'v5.9.0'
      k3s_image:
        description: 'k3s image (only used when cluster is k3d)'
        required: false
        default: 'rancher/k3s:v1.34.12-k3s1'
      storage:
        description: 'Storage mode: static (hand-made local volumes) or default (the cluster own dynamic storage, k3d only)'
        required: false
        type: choice
        default: 'static'
        options:
          - static
          - default
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/velero-test.yml
      - .github/scripts/velero-test.sh

permissions:
  contents: read

jobs:
  velero-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Tool versions
        run: |
          kubectl version --client
          helm version --short
          kind version || echo "kind is not preinstalled; the test script downloads v0.24.0"
      - name: Back up, delete and restore with Velero
        env:
          VELERO_VERSION: ${{ inputs.velero_version || 'v1.18.3' }}
          AWS_PLUGIN_VERSION: ${{ inputs.aws_plugin_version || 'v1.14.0' }}
          S3_IMAGE: ${{ inputs.s3_image || 'rustfs/rustfs@sha256:9ca9559533b537d10482fe923288b676ad08f92a7069d9a17327fbae3cab688b' }}
          CLUSTER: ${{ inputs.cluster || 'kind' }}
          K3D_VERSION: ${{ inputs.k3d_version || 'v5.9.0' }}
          K3S_IMAGE: ${{ inputs.k3s_image || 'rancher/k3s:v1.34.12-k3s1' }}
          STORAGE: ${{ inputs.storage || 'static' }}
        run: bash .github/scripts/velero-test.sh
