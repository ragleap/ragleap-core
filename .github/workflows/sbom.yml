name: "Generate SBOM"

on:
  push:
    branches: ["main"]
    paths:
      - "packages/ragleap-rag/pyproject.toml"
  workflow_dispatch: {}
  schedule:
    - cron: '0 5 * * 1'

jobs:
  sbom:
    name: Generate CycloneDX SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"

      - name: Create clean venv and install ragleap-rag[all]
        run: |
          python -m venv /tmp/sbom-venv
          /tmp/sbom-venv/bin/pip install --upgrade pip
          /tmp/sbom-venv/bin/pip install "./packages/ragleap-rag[all]"
          /tmp/sbom-venv/bin/pip install cyclonedx-bom

      - name: Generate SBOM (CycloneDX JSON)
        run: |
          /tmp/sbom-venv/bin/cyclonedx-py environment /tmp/sbom-venv \
            --pyproject packages/ragleap-rag/pyproject.toml \
            --mc-type library \
            --output-file packages/ragleap-rag/sbom.json \
            --of JSON

      - name: Upload SBOM as workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ragleap-rag-sbom
          path: packages/ragleap-rag/sbom.json
          retention-days: 90

      - name: Check for SBOM changes
        id: sbom_diff
        run: |
          git add packages/ragleap-rag/sbom.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open PR with updated SBOM
        if: steps.sbom_diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ secrets.SBOM_PR_TOKEN }}
          commit-message: "chore: regenerate SBOM"
          branch: ci/sbom-update
          delete-branch: true
          title: "chore: regenerate SBOM"
          body: "Automated SBOM regeneration (CycloneDX) reflecting current ragleap-rag dependencies. Triggered by ${{ github.event_name }}."
          add-paths: |
            packages/ragleap-rag/sbom.json
