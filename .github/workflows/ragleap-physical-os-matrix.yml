name: ragleap-physical Windows and macOS

# Informative for now (continue-on-error): it shows how the test suite behaves on Windows and macOS runners.
# It becomes blocking only after its results are understood. Additive: this file does not change ci.yml, which the other teams share.
# A normal run takes about a minute: the 12-minute limit and the 120 s stack dump make a hung test visible instead of costing 30 minutes.
on:
  pull_request:
    paths:
      - 'packages/ragleap-physical/**'
      - '.github/workflows/ragleap-physical-os-matrix.yml'
  push:
    branches: [main]
    paths:
      - 'packages/ragleap-physical/**'
      - '.github/workflows/ragleap-physical-os-matrix.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ragleap-physical-os-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: ragleap-physical ${{ matrix.os }} (${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    continue-on-error: true
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python-version: '3.11'
          - os: windows-latest
            python-version: '3.13'
          - os: macos-latest
            python-version: '3.10'
          - os: macos-latest
            python-version: '3.13'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install ragleap-physical with test deps
        working-directory: packages/ragleap-physical
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,mujoco,interop]"
      - name: Show the system and versions this run used
        run: |
          python -c "import platform; print(platform.platform()); print(platform.machine())"
          python --version
          pip list 2>/dev/null | grep -iE '^(mujoco|mcp|numpy|pytest|ragleap-physical) ' || true
      - name: Run ragleap-physical test suite
        working-directory: packages/ragleap-physical
        env:
          CI: "true"
        run: |
          python -m pytest -v -p no:cacheprovider -o faulthandler_timeout=120 -rxXs
