  publish-ragleap-voice:
    if: |
      startsWith(github.ref, 'refs/tags/ragleap-voice-v') ||
      (github.event_name == 'workflow_dispatch' && inputs.package == 'ragleap-voice')
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'pypi' }}
    permissions:
      id-token: write
    defaults:
      run:
        working-directory: packages/ragleap-voice
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
      - name: Check that the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -1)
          echo "pyproject version: $VERSION, tag: $GITHUB_REF_NAME"
          [ -n "$VERSION" ] || { echo "no version found in pyproject.toml"; exit 1; }
          [ "$GITHUB_REF_NAME" = "ragleap-voice-v$VERSION" ] || { echo "tag does not match the pyproject version"; exit 1; }
          grep -F "__version__ = \"$VERSION\"" src/ragleap_voice/__init__.py || { echo "__init__ version differs from pyproject"; exit 1; }
      - name: Install build tooling
        run: pip install "build==1.2.2"
      - name: Build sdist and wheel
        run: |
          rm -rf dist/
          python -m build
      - name: Check the built wheel (packaged manifest, locks and licence; no runtime dependencies)
        run: |
          [ "$(ls dist/*.whl | wc -l)" = "1" ]
          [ "$(ls dist/*.tar.gz | wc -l)" = "1" ]
          WHEEL=$(ls dist/*.whl)
          python -m zipfile -l "$WHEEL" | grep -F "ragleap_voice/data/models.toml"
          python -m zipfile -l "$WHEEL" | grep -F "ragleap_voice/data/THIRD_PARTY_NOTICES.md"
          python -m zipfile -l "$WHEEL" | grep -F "ragleap_voice/data/locks/indic-parler-tts.json"
          python -m zipfile -l "$WHEEL" | grep -F "ragleap_voice/data/locks/flan-t5-large-tokenizer.json"
          python -m zipfile -l "$WHEEL" | grep -E "dist-info/(licenses/)?LICENSE"
          if unzip -p "$WHEEL" '*.dist-info/METADATA' | grep '^Requires-Dist:' | grep -v 'extra =='; then
            echo "wheel declares runtime dependencies"
            exit 1
          fi
      - name: Smoke test the wheel in a clean environment
        run: |
          python -m venv /tmp/rv-venv
          /tmp/rv-venv/bin/pip install dist/*.whl
          cd /tmp
          /tmp/rv-venv/bin/ragleap-voice --version
          /tmp/rv-venv/bin/ragleap-voice models check
      - name: Publish to TestPyPI
        if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: packages/ragleap-voice/dist/
          repository-url: https://test.pypi.org/legacy/
      - name: Publish to PyPI (tag pushes only)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/ragleap-voice-v')
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: packages/ragleap-voice/dist/
