name: Release

on:
  push:
    tags:
      - 'ragleap-rag-v*'
      - 'ragleap-graph-v*'
      - 'ragleap-vectorstores-v*'
      - 'ragleap-ops-v*'
      - 'ragleap-app-chart-v*'
      - 'ragleap-observability-v*'
      - 'ragleap-tools-v*'
      - 'ragleap-terraform-v*'
      - 'ragleap-integrations-v*'
      - 'ragleap-agents-v*'
      - 'ragleap-ansible-v*'
      - 'ragleap-voice-v*'
      - 'ragleap-security-v*'
      - 'ragleap-memory-v*'
  workflow_dispatch:
    inputs:
      package:
        description: 'Which package to publish'
        required: true
        type: choice
        options:
          - ragleap-rag
          - ragleap-graph
          - ragleap-vectorstores
          - ragleap-ops
          - ragleap-app-chart
          - ragleap-observability
          - ragleap-tools
          - ragleap-terraform
          - ragleap-integrations
          - ragleap-agents
          - ragleap-ansible
          - ragleap-voice
          - ragleap-security
          - ragleap-memory
      target:
        description: 'Publish target'
        required: true
        type: choice
        default: testpypi
        options:
          - testpypi
          - pypi

jobs:
  publish-ragleap-rag:
    if: |
      startsWith(github.ref, 'refs/tags/ragleap-rag-v') ||
      (github.event_name == 'workflow_dispatch' && inputs.package == 'ragleap-rag')
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'pypi' }}
    permissions:
      id-token: write
    defaults:
      run:
        working-directory: packages/ragleap-rag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
      - name: Install build tooling
        run: pip install build
      - name: Build
        run: |
          rm -rf dist/
          python -m build
      - name: Publish to TestPyPI
        if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: packages/ragleap-rag/dist/
          repository-url: https://test.pypi.org/legacy/
      - name: Publish to PyPI
        if: github.event_name != 'workflow_dispatch' || inputs.target == 'pypi'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: packages/ragleap-rag/dist/
          skip-existing: true

  publish-ragleap-tools:
    if: |
      startsWith(github.ref, 'refs/tags/ragleap-tools-v') ||
      (github.event_name == 'workflow_dispatch' && inputs.package == 'ragleap-tools')
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'pypi' }}
    permissions:
