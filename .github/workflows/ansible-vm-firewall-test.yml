name: ansible-vm-firewall-test

# Runs the ragleap-ansible FIREWALL role on a REAL host (a GitHub-hosted runner, a disposable VM) and tests enforcement
# from a container on the Docker bridge: an opened port must stay reachable, a port that was not opened must be blocked.
# The script refuses to run anywhere except a GitHub-hosted runner. Manual (workflow_dispatch) or when a PR changes this
# file, the script or the Ansible package. Not a required check.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/ansible-vm-firewall-test.yml
      - .github/scripts/ansible-vm-firewall-test.sh
      - packages/ragleap-ansible/**

permissions:
  contents: read

jobs:
  ansible-vm-firewall-test:
    name: ansible-vm-firewall-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Firewall role on a real host, then enforcement from a container
        run: bash .github/scripts/ansible-vm-firewall-test.sh
      - name: The job is still alive after the firewall was switched on
        if: always()
        run: echo "STILL ALIVE after ufw enable (ufw=$(sudo ufw status | head -1))"
