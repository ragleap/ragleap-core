name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  compile-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
      - name: Compile check
        run: |
          python -m py_compile core/*.py
  docker-build-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Create .env for CI
        run: |
          cat > .env << 'ENVEOF'
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY_CI }}
          GEMINI_EMBEDDING_MODEL=models/gemini-embedding-001
          EMBEDDING_DIMENSIONS=3072
          GEMINI_CHAT_MODEL=gemini-3.5-flash
          DATABASE_URL=postgresql://ragleap:ragleap@db:5432/ragleap_core
          LLM_PROVIDER=gemini
          NEO4J_URI=bolt://neo4j:7687
          NEO4J_USER=neo4j
          NEO4J_PASSWORD=ragleapgraph
          ENVEOF
      - name: Build and start stack
        run: docker compose --profile full up --build -d
      - name: Wait for services to be healthy
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:8000/health > /dev/null; then
              echo "App is healthy"
              exit 0
            fi
            echo "Waiting for app... ($i/30)"
            sleep 2
          done
          echo "App failed to become healthy in time"
          docker compose logs
          exit 1
      - name: Wait for Neo4j to actually accept connections
        run: |
          for i in {1..30}; do
            if docker compose exec -T app python3 -c "from core.graph import graph_service; import sys; sys.exit(0 if graph_service.health_check() else 1)" 2>/dev/null; then
              echo "Neo4j is ready"
              exit 0
            fi
            echo "Waiting for Neo4j... ($i/30)"
            sleep 2
          done
          echo "Neo4j failed to become ready in time"
          docker compose logs neo4j
          exit 1
      - name: Smoke test - health check
        run: |
          curl -sf http://localhost:8000/health | grep -q '"status":"ok"'
      - name: Smoke test - upload and chat (skipped if no CI API key)
        env:
          HAS_CI_KEY: ${{ secrets.GEMINI_API_KEY_CI }}
        if: ${{ env.HAS_CI_KEY != '' }}
        run: |
          echo "RagLeap Core supports WhatsApp, Telegram, Discord, and voice calls." > /tmp/test_doc.txt
          curl -v -X POST -F "file=@/tmp/test_doc.txt" http://localhost:8000/upload
          echo ""
          curl -v -X POST "http://localhost:8000/chat?question=What+channels+are+supported"
      - name: Smoke test - knowledge graph (skipped if no CI API key)
        env:
          HAS_CI_KEY: ${{ secrets.GEMINI_API_KEY_CI }}
        if: ${{ env.HAS_CI_KEY != '' }}
        run: |
          docker compose exec -T app python3 -c "
          from core.graph import graph_service
          assert graph_service.driver is not None, 'Neo4j driver did not initialize'
          assert graph_service.health_check(), 'Neo4j health check failed'
          docs = graph_service.find_documents_by_entities(['RagLeap'])
          assert docs, f'Expected a document linked to entity RagLeap, got: {docs}'
          print('Knowledge graph smoke test passed:', docs)
          "
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose --profile full down -v
  core-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ragleap
          POSTGRES_PASSWORD: ragleap
          POSTGRES_DB: ragleap_core
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply schema
        env:
          PGPASSWORD: ragleap
        run: psql -h localhost -U ragleap -d ragleap_core -f db/schema.sql
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run core test suite
        env:
          DATABASE_URL: postgresql://ragleap:ragleap@localhost:5432/ragleap_core
        run: |
          python -m pytest tests/ -v
      - name: Docker file-grant tests
        env:
          DATABASE_URL: postgresql://ragleap:ragleap@localhost:5432/ragleap_core
          RAGLEAP_DOCKER_TESTS: '1'
        run: |
          docker pull python:3.11-slim
          python -m pytest tests/test_sandbox_files_docker.py -v

  ragleap-rag-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ragleap_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
      - name: Install ragleap-rag with test deps
        working-directory: packages/ragleap-rag
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,gemini,faiss,structured,formats,web,qdrant,weaviate,pinecone,milvus]"
      - name: Run ragleap-rag test suite
        working-directory: packages/ragleap-rag
        env:
          RAGLEAP_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ragleap_test
          GEMINI_API_KEY: fake-ci-key
        run: |
          python -m pytest tests/ -v

  ragleap-tools-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install ragleap-tools with test deps
        working-directory: packages/ragleap-tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,ingest]"
      - name: Run ragleap-tools test suite
        working-directory: packages/ragleap-tools
        run: |
          python -m pytest tests/ -v

  ragleap-integrations-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install ragleap-integrations with test deps
        working-directory: packages/ragleap-integrations
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Run ragleap-integrations test suite
        working-directory: packages/ragleap-integrations
        env:
          CI: "true"
        run: |
          python -m pytest tests/ -v

  ragleap-agents-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install ragleap-agents with test deps
        working-directory: packages/ragleap-agents
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Run ragleap-agents test suite
        working-directory: packages/ragleap-agents
        run: |
          python -m pytest tests/ -v

  ragleap-security-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install ragleap-security with test deps
        working-directory: packages/ragleap-security
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Run ragleap-security test suite (without the crypto extra)
        working-directory: packages/ragleap-security
        run: |
          python -m pytest tests/ -v
      - name: Install the crypto extra and run the suite again
        working-directory: packages/ragleap-security
        run: |
          pip install -e ".[crypto]"
          python -m pytest tests/ -v

  ragleap-memory-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install ragleap-memory with test deps (ragleap-security from this repo)
        working-directory: packages/ragleap-memory
        run: |
          python -m pip install --upgrade pip
          pip install -e ../ragleap-security -e ".[test]"
      - name: Run ragleap-memory test suite
        working-directory: packages/ragleap-memory
        run: |
          python -m pytest tests/ -v

  ragleap-optimizer-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install ragleap-optimizer with test deps (ragleap-security from this repo)
        working-directory: packages/ragleap-optimizer
        run: |
          python -m pip install --upgrade pip
          pip install -e ../ragleap-security -e ".[test]"
      - name: Run ragleap-optimizer test suite
        working-directory: packages/ragleap-optimizer
        run: |
          python -m pytest tests/ -v

  ragleap-graph-tests:
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5
        env:
          NEO4J_AUTH: neo4j/testpassword123
        ports:
          - 7687:7687
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
      - name: Install ragleap-graph with test deps
        working-directory: packages/ragleap-graph
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Wait for Neo4j to accept connections
        run: |
          for i in {1..30}; do
            if python3 -c "
          from neo4j import GraphDatabase
          d = GraphDatabase.driver('bolt://localhost:7687', auth=('neo4j','testpassword123'))
          d.verify_connectivity()
          d.close()
          " 2>/dev/null; then
              echo "Neo4j is ready"
              exit 0
            fi
            echo "Waiting for Neo4j... ($i/30)"
            sleep 2
          done
          echo "Neo4j failed to become ready in time"
          exit 1
      - name: Run ragleap-graph test suite
        working-directory: packages/ragleap-graph
        env:
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: testpassword123
        run: |
          python -m pytest tests/ -v

  ragleap-voice-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install ragleap-voice with test deps (core has no runtime deps)
        working-directory: packages/ragleap-voice
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Run ragleap-voice test suite (fake engines only, no models)
        working-directory: packages/ragleap-voice
        run: |
          python -m pytest tests/ -v

  ragleap-voice-wheel-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Build the wheel
        working-directory: packages/ragleap-voice
        run: |
          python -m pip install --upgrade pip
          pip install "build==1.2.2"
          python -m build --wheel
      - name: Check wheel contents (packaged manifest, no runtime dependencies)
        working-directory: packages/ragleap-voice
        run: |
          [ "$(ls dist/*.whl | wc -l)" = "1" ]
          WHEEL=$(ls dist/*.whl)
          python -m zipfile -l "$WHEEL" | grep -F "ragleap_voice/data/models.toml"
          python -m zipfile -l "$WHEEL" | grep -F "ragleap_voice/data/THIRD_PARTY_NOTICES.md"
          if unzip -p "$WHEEL" '*.dist-info/METADATA' | grep '^Requires-Dist:' | grep -v 'extra =='; then
            echo "wheel declares runtime dependencies"
            exit 1
          fi
      - name: Install the wheel in a clean environment and run the CLI
        run: |
          WHEEL=$(ls packages/ragleap-voice/dist/*.whl)
          python -m venv /tmp/smoke-venv
          /tmp/smoke-venv/bin/pip install "$WHEEL"
          EXTRA=$(/tmp/smoke-venv/bin/pip list --format=freeze | grep -v -E '^(pip|setuptools|wheel|ragleap-voice)==' || true)
          [ -z "$EXTRA" ] || { echo "unexpected packages installed: $EXTRA"; exit 1; }
          cd /tmp
          /tmp/smoke-venv/bin/ragleap-voice --version
          /tmp/smoke-venv/bin/ragleap-voice models check
          /tmp/smoke-venv/bin/ragleap-voice models list
          /tmp/smoke-venv/bin/python -m ragleap_voice models check

  ragleap-rag-java-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ragleap_java_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
      - name: Run ragleap-rag Java test suite
        working-directory: java/ragleap-rag
        env:
          RAGLEAP_JAVA_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ragleap_java_test
        run: mvn -B test

  ragleap-graph-java-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
      - name: Run ragleap-graph Java test suite
        working-directory: java/ragleap-graph
        run: mvn -B test

  ragleap-vectorstores-java-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
      - name: Run ragleap-vectorstores Java test suite
        working-directory: java/ragleap-vectorstores
        run: mvn -B test

  ragleap-vectorstores-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the package's declared minimum (requires-python >=3.10)
        # and the exact version that exposed a real Python-version bug
        # missed by CI running only 3.11/3.12 elsewhere - keeping it in
        # the matrix is the point of this job, not an oversight.
        python-version: ['3.10', '3.12']
    services:
      redis:
        image: redis/redis-stack-server:latest
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # test_missing_search_module_raises() hardcodes REDIS_NO_SEARCH_URL to
      # redis://localhost:6379/2 (mirroring real production Redis 6.0.16 on
      # srv1477778, which has no RediSearch module) - a plain Redis on 6379
      # satisfies that without touching test code. Redis Stack's own
      # RediSearch module additionally refuses to create indexes on any db
      # other than 0 ("Cannot create index on db != 0"), which is the real
      # error this two-service split avoids.
      redis-no-search:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install ragleap-vectorstores with test deps
        working-directory: packages/ragleap-vectorstores
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,chroma,lancedb,redis]"
      - name: Run ragleap-vectorstores test suite
        working-directory: packages/ragleap-vectorstores
        env:
          REDIS_TEST_URL: redis://localhost:6380/0
        run: |
          python -m pytest tests/ -v

  helm-chart-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: helm/chart-testing-action@720270857a28afd41e2426521a7801db09e9b510 # v2.9.0
      - name: Lint changed charts
        run: ct lint --config .github/ct.yaml

  terraform-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      - name: Validate kind-cluster module
        working-directory: packages/ragleap-terraform/modules/kind-cluster
        run: |
          ok=0
          for i in 1 2 3; do
            terraform init -backend=false && ok=1 && break
            echo "terraform init failed (try $i of 3), retrying in 20 s"; sleep 20
          done
          [ "$ok" = 1 ]
          terraform validate
      - name: Validate kind example
        working-directory: packages/ragleap-terraform/examples/kind
        run: |
          ok=0
          for i in 1 2 3; do
            terraform init -backend=false && ok=1 && break
            echo "terraform init failed (try $i of 3), retrying in 20 s"; sleep 20
          done
          [ "$ok" = 1 ]
          terraform validate
      - name: Check formatting
        working-directory: packages/ragleap-terraform
        run: terraform fmt -check -recursive

  slo-rules-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: promtool rule tests
        run: packages/ragleap-observability/tests/promtool/run.sh

  wheel-contents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Wheels must contain their charts, modules and playbooks
        run: packages/check_wheels.sh

  package-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [ragleap-ops, ragleap-observability, ragleap-terraform, ragleap-app-chart, ragleap-ansible]
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install and test
        working-directory: packages/${{ matrix.package }}
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
          python -m pytest tests/ -v

  ragleap-physical-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install ragleap-physical with test deps
        working-directory: packages/ragleap-physical
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,mujoco,interop]"
      - name: Run ragleap-physical test suite
        working-directory: packages/ragleap-physical
        env:
          CI: "true"
        run: |
          python -m pytest -v
