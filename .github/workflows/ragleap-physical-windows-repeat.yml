name: ragleap-physical Windows repeat

# Informative. Repeats three console tests many times on Windows and counts the failures, so that a change to the busy refusal is judged by a rate and
# not by one run. Starts by hand (workflow_dispatch) and runs on pull requests that change the console or this file. Additive: it does not change ci.yml.
on:
  workflow_dispatch:
    inputs:
      runs:
        description: 'How many times to run each test (1 to 100)'
        required: false
        default: '30'
  pull_request:
    paths:
      - 'packages/ragleap-physical/src/ragleap_physical/console.py'
      - '.github/workflows/ragleap-physical-windows-repeat.yml'

permissions:
  contents: read

concurrency:
  group: ragleap-physical-windows-repeat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repeat:
    name: ragleap-physical windows repeat (${{ matrix.python-version }})
    runs-on: windows-latest
    timeout-minutes: 40
    continue-on-error: true
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install ragleap-physical with test deps
        working-directory: packages/ragleap-physical
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Repeat the console tests
        working-directory: packages/ragleap-physical
        env:
          RUNS_INPUT: ${{ github.event.inputs.runs }}
        run: |
          runs="${RUNS_INPUT:-20}"
          case "$runs" in ''|*[!0-9]*) runs=20 ;; esac
          if [ "$runs" -lt 1 ]; then runs=1; fi
          if [ "$runs" -gt 100 ]; then runs=100; fi
          out="${RUNNER_TEMP:-/tmp}/repeat_out.txt"
          summary="${GITHUB_STEP_SUMMARY:-/dev/null}"
          python --version
          { echo "### Windows repeat, Python ${{ matrix.python-version }}, $runs runs per test"; echo; echo "| test | passed | failed |"; echo "|---|---|---|"; } >> "$summary"
          for t in \
            "tests/test_console_threaded.py::test_connections_beyond_the_cap_are_refused_at_once_and_the_slots_come_back" \
            "tests/test_console_busy_linger_review.py::test_a_busy_refusal_ends_cleanly_for_a_client_that_sent_a_body" \
            "tests/test_console_busy_linger_review.py::test_when_every_helper_is_busy_a_refusal_is_still_answered_and_closed_at_once"; do
            ok=0; bad=0; shown=0
            for i in $(seq 1 "$runs"); do
              if python -m pytest -q -p no:cacheprovider --runxfail "$t" > "$out" 2>&1; then
                ok=$((ok + 1))
              else
                bad=$((bad + 1))
                if [ "$shown" -lt 1 ]; then
                  shown=1
                  echo "FIRST FAILURE of ${t##*::} (run $i):"
                  grep -E "^E |Error" "$out" | head -8
                fi
              fi
            done
            echo "RESULT ${t##*::}: $ok passed, $bad failed of $runs"
            echo "| ${t##*::} | $ok | $bad |" >> "$summary"
          done
          echo "Done."
