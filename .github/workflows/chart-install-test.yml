name: chart-install-test

# Install, upgrade and uninstall test for the three RagLeap Helm charts on a throwaway kind cluster.
# Manual (workflow_dispatch) or when a PR changes this file or the test script. Not a required check.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/chart-install-test.yml
      - .github/scripts/chart-install-test.sh

permissions:
  contents: read
  packages: read

jobs:
  chart-install-test:
    name: chart-install-test (k8s ${{ matrix.k8s }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # One leg per Kubernetes version (node images from the kind v0.33.0 release notes, pinned by digest).
    # fail-fast is off so that one failing version does not hide the others.
    strategy:
      fail-fast: false
      matrix:
        include:
          - k8s: v1.34.11
            node_image: kindest/node:v1.34.11@sha256:44e222ee2132dab25ff87301682f89eb82c7880ea3a1bf543bfe9708fd08d67d
          - k8s: v1.36.4
            node_image: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
          - k8s: v1.37.0
            node_image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Tool versions
        run: |
          kubectl version --client
          helm version --short
          kind version || echo "kind is not preinstalled; the test script downloads v0.24.0"
      - name: Install, upgrade and uninstall the three charts on kind
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KIND_NODE_IMAGE: ${{ matrix.node_image }}
        run: bash .github/scripts/chart-install-test.sh
