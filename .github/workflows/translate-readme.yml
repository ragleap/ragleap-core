name: Translate README

# Two triggers:
# - push to README.md: automatic, so translations stay in sync with docs
#   changes without anyone remembering to click a button.
# - workflow_dispatch: manual, for resuming progress on a free-tier key's
#   20-requests/day quota (see scripts/translate_readme.py) -- one run
#   rarely finishes all 54 languages, so this lets you re-trigger to
#   continue on a later day without waiting for another README edit.
on:
  push:
    branches: [main]
    paths:
      - README.md
  workflow_dispatch:

# github-actions[bot]'s default token is read-only in this repo, which
# made peter-evans/create-pull-request fail with a 403 pushing the
# translation branch (confirmed live). Explicitly grant this workflow
# the two scopes it actually needs, rather than changing the repo-wide
# default token permissions.
permissions:
  contents: write
  pull-requests: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Resume from existing translation branch if one is open
        # scripts/translate_readme.py is resumable (skips already-current
        # translations via readmes/.translation_state.json), but that only
        # works if it can see PREVIOUS partial progress. If an earlier run
        # already opened a PR on docs/readme-translations with some
        # languages done, build on top of that instead of starting over
        # from main (which has none of that progress until the PR merges).
        run: |
          if git ls-remote --exit-code --heads origin docs/readme-translations > /dev/null 2>&1; then
            echo "Existing docs/readme-translations branch found, resuming from it"
            git fetch origin docs/readme-translations
            git checkout docs/readme-translations
            git merge origin/main --no-edit -m "merge main into docs/readme-translations"
          else
            echo "No existing translation branch, starting fresh from main"
          fi

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install google-genai

      - name: Translate README into 54 languages
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_CI }}
        run: python3 scripts/translate_readme.py

      - name: Open PR with translations
        uses: peter-evans/create-pull-request@15733dbdfeedb4f7fdb73d13c6f5ac83b710fab8 # v8
        with:
          base: main
          commit-message: "docs: update README translations"
          title: "docs: update README translations (54 languages)"
          body: |
            Auto-generated by the Translate README workflow, translating
            README.md into all 54 languages core/language.py's
            LanguageDetector supports (langdetect's profile set, minus
            English).

            This may represent partial progress if the free-tier Gemini
            key's 20-requests/day quota was hit mid-run -- re-running the
            workflow (or the next README.md push) will continue where
            this left off. See readmes/.translation_state.json for
            per-language completion status.

            Please review before merging -- translation quality is not
            spot-checked automatically.
          branch: docs/readme-translations
          delete-branch: true
