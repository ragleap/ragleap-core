name: Track Repo Clone Count

# GitHub's traffic API only returns a rolling 14-day window with no history
# endpoint -- see scripts/track_clone_count.py's module docstring for why this
# runs daily and accumulates into a committed state file rather than querying
# on demand. workflow_dispatch lets you trigger a catch-up run manually.
#
# main is protected by a repository ruleset (main-protection) with
# bypass_actors: [] -- literally nothing, not even repo admins via PAT, can
# push directly to main. So this MUST go through a real pull request, same as
# translate-readme.yml. required_approving_review_count is 0 and the only
# required checks are compile-check + docker-build-and-smoke-test, both fast
# and already reliable, so the PR just needs a manual merge click (or you can
# enable auto-merge later if you want this fully hands-off).
on:
  schedule:
    - cron: "17 3 * * *"  # once daily; odd minute to avoid GitHub's peak-time scheduling delays
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  track-clones:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"

      - name: Update clone count
        env:
          GH_TRAFFIC_TOKEN: ${{ secrets.CLONE_TRAFFIC_TOKEN }}
          REPO: ragleap/ragleap-core
        run: python3 scripts/track_clone_count.py

      - name: Open PR with updated badge, if anything changed
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          base: main
          commit-message: "chore: update repo clone count badge"
          title: "chore: update repo clone count badge"
          body: |
            Auto-generated by the Track Repo Clone Count workflow.
            Updates .github/badges/clone-count.json and
            .github/badges/clone-history.json with today's clone traffic.

            See scripts/track_clone_count.py for why this can only be a
            running total starting from when this workflow was added, not a
            true all-time count (GitHub's traffic API has no history
            endpoint).
          branch: chore/update-clone-count
          delete-branch: true
          add-paths: |
            .github/badges/clone-count.json
            .github/badges/clone-history.json
