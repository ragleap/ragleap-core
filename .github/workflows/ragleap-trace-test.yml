name: ragleap-trace-test
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "packages/ragleap-trace/**"
      - ".github/workflows/ragleap-trace-test.yml"
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: packages/ragleap-trace
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[test]"
      - run: pytest -q
      - run: python scripts/mutation_check.py
