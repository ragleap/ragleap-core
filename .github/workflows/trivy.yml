name: Trivy
on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - 'packages/*/helm/**'
      - 'packages/*/k8s/**'
      - '.github/workflows/trivy.yml'
      - '.github/trivyignore.yaml'
jobs:
  chart-config-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: packages
          severity: HIGH,CRITICAL
          exit-code: '1'
        env:
          TRIVY_IGNOREFILE: .github/trivyignore.yaml
  image-scan:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with the ragleap-observability chart values.
        image:
          - prom/prometheus:v3.13.4
          - grafana/grafana:12.4.12
          - grafana/loki:3.6.17
          - prom/alertmanager:v0.34.1
          - grafana/promtail:3.3.0
          - grafana/alloy:v1.20.1
          - quay.io/prometheuscommunity/postgres-exporter:v0.20.1
    steps:
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
      # Gate: a fixable CRITICAL fails the run. HIGH stays report-only (the step above).
      # Two images are exceptions and are not gated, each for a written reason:
      #   grafana/grafana  - base-image CRITICAL (brotli-libs, CVE-2026-111497); needs a Grafana image bump, tracked separately.
      #   grafana/promtail - end of life (Grafana ended Promtail on 2026-03-02); its replacement is Alloy, tracked separately.
      - name: Gate on CRITICAL
        if: ${{ !startsWith(matrix.image, 'grafana/grafana:') }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
