name: Trivy
on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - 'packages/*/helm/**'
      - 'packages/*/k8s/**'
      - '.github/workflows/trivy.yml'
      - '.github/trivyignore.yaml'
jobs:
  chart-config-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: packages
          severity: HIGH,CRITICAL
          exit-code: '1'
        env:
          TRIVY_IGNOREFILE: .github/trivyignore.yaml
  image-scan:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with the ragleap-observability chart values.
        image:
          - prom/prometheus:v3.16.0
          - grafana/grafana:12.4.15
          - grafana/loki:3.7.11
          - prom/alertmanager:v0.35.1
          - grafana/promtail:3.3.0
          - grafana/alloy:v1.22.0
          - quay.io/prometheuscommunity/postgres-exporter:v0.20.1
          # Images the ragleap-ops and ragleap-app-chart defaults deploy. The tags are floating (major only),
          # so a scan shows what each tag holds today.
          - pgvector/pgvector:pg16
          - neo4j:5-community
          - postgres:16-alpine
          - postgres:16
          - busybox:1.36
          # Image of the neo4j backup cronjob (packages/ragleap-ops/k8s/neo4j-backup-cronjob.yaml); pinned by tag, not floating.
          - alpine/kubectl:1.37.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
      # Gate: a fixable CRITICAL fails the run. HIGH stays report-only (the step above).
      # One image is an exception and is not gated, for a written reason:
      #   grafana/promtail - end of life (Grafana ended Promtail on 2026-03-02); its replacement is Alloy, tracked separately.
      - name: Gate on CRITICAL
        if: ${{ !startsWith(matrix.image, 'grafana/promtail:') }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
        env:
          TRIVY_IGNOREFILE: .github/trivyignore.yaml
