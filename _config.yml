# Minimal Jekyll config for GitHub Pages.
# No theme - just enough to apply a default layout (for mermaid.js) to
# every page, since GitHub Pages serves README.md as the site index by
# default with zero styling/scripts otherwise.
markdown: kramdown
defaults:
  - scope:
      path: ""
    values:
      layout: "default"

# Not part of the site: Ansible/Jinja files start with "---" and contain "{{ }}",
# which Jekyll would render with Liquid and the Pages build fails.
exclude:
  - packages/ragleap-ansible/playbooks
