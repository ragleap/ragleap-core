[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ragleap-trace"
version = "0.1.0"
description = "Dependency-free tracing for RagLeap: spans with hard limits, privacy-safe by default"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "RagLeap" }]
keywords = ["ragleap", "tracing", "observability", "llm", "rag"]
dependencies = []
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/ragleap/ragleap-core"
Source = "https://github.com/ragleap/ragleap-core/tree/main/packages/ragleap-trace"
Changelog = "https://github.com/ragleap/ragleap-core/blob/main/packages/ragleap-trace/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.hatch.build.targets.wheel]
packages = ["src/ragleap_trace"]

[tool.pytest.ini_options]
testpaths = ["tests"]
