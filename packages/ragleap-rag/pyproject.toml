[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ragleap-rag"
version = "0.16.0"
description = "Self-hosted RAG engine: hybrid dense+sparse retrieval, 28-format ingestion (docs, URLs, images, audio, video), 6 vector backends, 8 embedding providers, 12+ generation providers with automatic fallback, query rewriting (HyDE/contextual/multi-query), structured JSON output, real per-call cost tracking, and standalone retrieval via retrieve(). Composable with the optional ragleap-graph package for knowledge-graph-augmented retrieval. BYOK, no vendor lock-in, no hardcoded model defaults."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Antony", email = "antony@ragleap.com" }
]
keywords = ["rag", "retrieval-augmented-generation", "llm", "vector-search", "pgvector", "hybrid-search", "embeddings", "faiss", "pinecone", "weaviate", "qdrant", "milvus", "gemini", "anthropic", "openai", "reranking", "structured-output", "query-rewriting", "cost-tracking", "self-hosted", "byok"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Linguistic",
]

dependencies = [
    "psycopg2-binary>=2.9.0",
    "requests>=2.31.0",
    "pypdf>=6.15.0",
    "python-docx>=1.1.0",
    "tiktoken>=0.12.0",
]

[project.optional-dependencies]
gemini = ["google-genai>=0.3.0"]
test = ["pytest>=8.0.0", "pytest-asyncio>=0.24.0", "psycopg2-binary>=2.9.0", "xlwt>=1.3.0"]
anthropic = ["anthropic>=0.34.0"]
openai = ["openai>=1.40.0"]
rerank = ["onnxruntime>=1.17.0", "tokenizers>=0.19.0", "huggingface_hub>=0.20.0"]
faiss = ["faiss-cpu>=1.8.0"]
pinecone = ["pinecone>=5.0.0"]
weaviate = ["weaviate-client>=4.0.0"]
qdrant = ["qdrant-client>=1.10.0"]
milvus = ["pymilvus>=2.4.0"]
structured = ["jsonschema>=4.0.0"]
web = ["trafilatura>=1.6.0", "lxml_html_clean>=0.4.0"]
ocr = ["pytesseract>=0.3.10", "Pillow>=10.0.0"]
redis = ["redis>=5.0.0"]
formats = [
    "openpyxl>=3.1.0",
    "xlrd>=2.0.0",
    "python-pptx>=1.0.0",
    "odfpy>=1.4.0",
    "striprtf>=0.0.26",
    "beautifulsoup4>=4.12.0",
    "ebooklib>=0.18",
    "pyyaml>=6.0",
    "pyarrow>=14.0.0",
    "pandas>=2.2.2",
]
all = ["google-genai>=0.3.0", "anthropic>=0.34.0", "openai>=1.40.0", "onnxruntime>=1.17.0", "tokenizers>=0.19.0", "huggingface_hub>=0.20.0", "faiss-cpu>=1.8.0", "trafilatura>=1.6.0", "lxml_html_clean>=0.4.0", "pytesseract>=0.3.10", "Pillow>=10.0.0", "redis>=5.0.0", "openpyxl>=3.1.0", "xlrd>=2.0.0", "python-pptx>=1.0.0", "odfpy>=1.4.0", "striprtf>=0.0.26", "beautifulsoup4>=4.12.0", "ebooklib>=0.18", "pyyaml>=6.0", "pyarrow>=14.0.0", "pandas>=2.2.2", "jsonschema>=4.0.0", "pinecone>=5.0.0", "weaviate-client>=4.0.0", "qdrant-client>=1.10.0", "pymilvus>=2.4.0"]

[project.urls]
Homepage = "https://github.com/ragleap/ragleap-core"
Repository = "https://github.com/ragleap/ragleap-core"
Documentation = "https://packages.ragleap.com/docs/ragleap-rag.html"
Issues = "https://github.com/ragleap/ragleap-core/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/ragleap"]
