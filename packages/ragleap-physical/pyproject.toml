[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ragleap-physical"
version = "0.0.5"
description = "Simulation-first, observe-first bridge between RagLeap and open-source simulators (pre-alpha)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "RagLeap Contributors" }]
keywords = ["simulation", "robotics", "mujoco", "safety", "human-in-the-loop", "approval", "ai-agents", "mcp",
            "machine-tool", "tool-wear", "mtconnect", "energy-monitoring", "observe-only", "pre-alpha"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/ragleap/ragleap-core/tree/main/packages/ragleap-physical"
Documentation = "https://github.com/ragleap/ragleap-core/blob/main/packages/ragleap-physical/README.md"
Source = "https://github.com/ragleap/ragleap-core"
Issues = "https://github.com/ragleap/ragleap-core/issues"
Changelog = "https://github.com/ragleap/ragleap-core/blob/main/packages/ragleap-physical/CHANGELOG.md"
Roadmap = "https://github.com/ragleap/ragleap-core/wiki/Roadmap"

[project.optional-dependencies]
mujoco = ["mujoco>=3.0"]
test = ["pytest>=7"]
interop = ["mcp>=1.28,<2"]  # only for the interop test; pinned below v2

[tool.hatch.build.targets.wheel]
packages = ["src/ragleap_physical"]

[tool.pytest.ini_options]
testpaths = ["tests", "examples/robots", "benchmarks"]
pythonpath = ["src", "tests"]
