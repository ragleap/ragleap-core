apiVersion: apps/v1
kind: Deployment
metadata:
  name: ragleap-db
  labels:
    app: ragleap-db
spec:
  replicas: 1  # intentionally not configurable - stateful, single-writer, ReadWriteOnce PVC
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ragleap-db
  template:
    metadata:
      labels:
        app: ragleap-db
    spec:
      automountServiceAccountToken: false
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: ragleap-db
      {{- end }}
      initContainers:
        - name: fix-permissions
          image: busybox:1.36
          command: ["sh", "-c", "chown -R 999:999 /var/lib/postgresql/data"]
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
          volumeMounts:
            - name: db-data
              mountPath: /var/lib/postgresql/data
      containers:
        - name: db
          image: {{ .Values.db.image }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          envFrom:
            - secretRef:
                name: ragleap-db-secret
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: db-data
              mountPath: /var/lib/postgresql/data
            - name: db-schema
              mountPath: /docker-entrypoint-initdb.d/01-schema.sql
              subPath: schema.sql
            - name: db-run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.db.credentials.user | quote }}]
            initialDelaySeconds: {{ .Values.db.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.db.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.db.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.db.probes.readiness.failureThreshold }}
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.db.credentials.user | quote }}]
            initialDelaySeconds: {{ .Values.db.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.db.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.db.probes.liveness.failureThreshold }}
      volumes:
        - name: db-data
          persistentVolumeClaim:
            claimName: ragleap-db-data-broken
        - name: db-schema
          configMap:
            name: ragleap-db-schema
        - name: db-run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
