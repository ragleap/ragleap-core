apiVersion: apps/v1
kind: Deployment
metadata:
  name: ragleap-neo4j
  labels:
    app: ragleap-neo4j
spec:
  replicas: 1  # intentionally not configurable - stateful, single-writer, ReadWriteOnce PVC
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ragleap-neo4j
  template:
    metadata:
      labels:
        app: ragleap-neo4j
    spec:
      automountServiceAccountToken: false
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: ragleap-neo4j
      {{- end }}
      initContainers:
        - name: fix-permissions
          image: busybox:1.36
          command: ["sh", "-c", "chown -R 7474:7474 /data"]
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
          volumeMounts:
            - name: neo4j-data
              mountPath: /data
      containers:
        - name: neo4j
          image: {{ .Values.neo4j.image }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 7474
            allowPrivilegeEscalation: false
            # readOnlyRootFilesystem CONFIRMED UNSAFE for this service,
            # live-tested on a real kind cluster (not just speculated):
            # mounting /var/lib/neo4j/conf as a writable emptyDir (required
            # since the entrypoint rewrites this dir on every container
            # restart, confirmed via file mtime vs container finishedAt)
            # SHADOWS the image's real baked-in default config, silently
            # dropping it from 350 real lines to ~5. Real losses included
            # server.directories.import=import (a security boundary
            # restricting LOAD CSV to Neo4j's own import/ dir) and ~17 JVM
            # tuning/TLS-hardening flags. The pod still reached Running and
            # answered basic Cypher queries -- this would NOT have been
            # caught without deliberately diffing the real conf file
            # against the image's shipped default. Do not enable this flag
            # for neo4j without first solving the conf-shadowing problem
            # (e.g. a ConfigMap seeded from the image's real defaults, not
            # an empty emptyDir).
          envFrom:
            - secretRef:
                name: ragleap-neo4j-secret
          env:
            - name: NEO4J_PLUGINS
              value: {{ .Values.neo4j.plugins | quote }}
          ports:
            - containerPort: {{ .Values.neo4j.ports.http }}
            - containerPort: {{ .Values.neo4j.ports.bolt }}
          resources:
            requests:
              memory: {{ .Values.neo4j.resources.requests.memory }}
              cpu: {{ .Values.neo4j.resources.requests.cpu }}
            limits:
              memory: {{ .Values.neo4j.resources.limits.memory }}
          volumeMounts:
            - name: neo4j-data
              mountPath: /data
            - name: neo4j-logs
              mountPath: /logs
            - name: neo4j-run
              mountPath: /var/lib/neo4j/run
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.neo4j.ports.http }}
            initialDelaySeconds: {{ .Values.neo4j.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.neo4j.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.neo4j.probes.readiness.failureThreshold }}
          livenessProbe:
            httpGet:
              path: /
              port: {{ .Values.neo4j.ports.http }}
            initialDelaySeconds: {{ .Values.neo4j.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.neo4j.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.neo4j.probes.liveness.failureThreshold }}
      volumes:
        - name: neo4j-data
          persistentVolumeClaim:
            claimName: ragleap-neo4j-data-broken
        - name: neo4j-logs
          emptyDir: {}
        - name: neo4j-run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
