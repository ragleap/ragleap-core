db:
  image: pgvector/pgvector:pg16
  storage: 5Gi   # UNVERIFIED — compose used an unbounded volume, size for real capacity needs
  credentials:
    user: ragleap
    password: ragleap   # override via --set or a values-prod.yaml — never commit real prod creds
    database: ragleap_core
  probes:
    readiness:
      initialDelaySeconds: 15
      periodSeconds: 5
      timeoutSeconds: 5
      failureThreshold: 6
    liveness:
      initialDelaySeconds: 45
      periodSeconds: 10
      failureThreshold: 6

app:
  replicaCount: 1
  image: ghcr.io/ragleap/ragleap-app:0.11.1
  imagePullSecret: ghcr-pull-secret
  port: 8000
  # Numeric UID of the image's ragleap user (the Dockerfile creates it with --uid 10001).
  # runAsNonRoot cannot be verified against a named user, so the containers need a number.
  runAsUser: 10001
  # Optional container resources. Empty by default (no behaviour change).
  # CPU-percentage autoscaling needs resources.requests.cpu to be set.
  resources: {}
  autoscaling:
    enabled: false
    minReplicas: 1
    # maxReplicas is required when enabled is true
    targetCPUUtilizationPercentage: 80
  pdb:
    enabled: false
    minAvailable: 1
  probes:
    readiness:
      initialDelaySeconds: 5
    liveness:
      initialDelaySeconds: 15

voice:
  replicaCount: 1
  image: ghcr.io/ragleap/ragleap-app:0.11.1
  imagePullSecret: ghcr-pull-secret
  port: 8765
  # Numeric UID of the image's ragleap user (the Dockerfile creates it with --uid 10001).
  # runAsNonRoot cannot be verified against a named user, so the containers need a number.
  runAsUser: 10001
  # Optional container resources. Empty by default (no behaviour change).
  # CPU-percentage autoscaling needs resources.requests.cpu to be set.
  resources: {}
  autoscaling:
    enabled: false
    minReplicas: 1
    # maxReplicas is required when enabled is true
    targetCPUUtilizationPercentage: 80
  pdb:
    enabled: false
    minAvailable: 1
  command: ["python3", "-m", "channels.voice.server"]

neo4j:
  image: neo4j:5-community
  resources:
    requests:
      memory: 512Mi
      cpu: 50m
    limits:
      memory: 1Gi
  storage: 5Gi   # UNVERIFIED — same as db, size for real capacity needs
  auth: neo4j/ragleapgraph
  plugins: "[]"
  ports:
    http: 7474
    bolt: 7687
  probes:
    readiness:
      initialDelaySeconds: 20
      periodSeconds: 10
      failureThreshold: 12
    liveness:
      initialDelaySeconds: 60
      periodSeconds: 10
      failureThreshold: 6

ingress:
  enabled: false   # set true once hostname and issuer are configured for your real cluster
  hostname: app.example.com   # REPLACE with your real domain before enabling
  ingressClassName: nginx
  clusterIssuer: letsencrypt-prod   # REPLACE with your own ClusterIssuer name; see README for setup

# Dedicated zero-permission ServiceAccounts for db/app/voice/neo4j.
# Set create: false if you manage ServiceAccounts yourself (e.g. they
# already exist from the raw k8s/ manifests). Tokens are never mounted.
serviceAccount:
  create: true
