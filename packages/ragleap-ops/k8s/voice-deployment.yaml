apiVersion: apps/v1
kind: Deployment
metadata:
  name: ragleap-voice
  namespace: ragleap-core
  labels:
    app: ragleap-voice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ragleap-voice
  template:
    metadata:
      labels:
        app: ragleap-voice
    spec:
      serviceAccountName: ragleap-voice
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull-secret
      initContainers:
        - name: wait-for-db
          image: postgres:16-alpine
          command: ["sh", "-c", "until pg_isready -h ragleap-db -p 5432 -U ragleap; do sleep 2; done"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 70
            allowPrivilegeEscalation: false
      containers:
        - name: voice
          image: ghcr.io/ragleap/ragleap-app:0.11.1
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          command: ["python3", "-m", "channels.voice.server"]
          ports:
            - containerPort: 8765
          envFrom:
            - secretRef:
                name: ragleap-app-env
          env:
            - name: DATABASE_URL
              value: "postgresql://ragleap:ragleap@ragleap-db:5432/ragleap_core"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
