[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ragleap-ops"
version = "0.6.2"
description = "Kubernetes deployment manifests and Helm chart for RagLeap Core, tested in CI on throwaway kind and k3d clusters"
readme = "README.md"
keywords = ["kubernetes", "k8s", "helm", "helm-chart", "devops", "deployment", "rag", "pgvector", "postgresql", "neo4j", "networkpolicy", "serviceaccount", "backup", "disaster-recovery"]
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "RagLeap Contributors" }
]
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: System :: Systems Administration",
]
dependencies = []

[project.urls]
Homepage = "https://packages.ragleap.com/docs/ragleap-ops.html"
Documentation = "https://packages.ragleap.com/docs/ragleap-ops.html"
Source = "https://github.com/ragleap/ragleap-core/tree/main/packages/ragleap-ops"
Changelog = "https://github.com/ragleap/ragleap-core/blob/main/packages/ragleap-ops/CHANGELOG.md"
Issues = "https://github.com/ragleap/ragleap-core/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/ragleap_ops"]

[tool.hatch.build.targets.wheel.force-include]
"helm" = "ragleap_ops/helm"
"k8s" = "ragleap_ops/k8s"
