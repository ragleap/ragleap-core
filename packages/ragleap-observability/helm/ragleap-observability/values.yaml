# ragleap-observability — Prometheus + exporters (step 1 of the planned build order)
#
# Grafana, Loki, and AlertManager are NOT yet configured here — per the
# README's build order, alerting/dashboards come after real metrics
# are proven flowing, not before.

postgresExporter:
  enabled: true
  image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
  # Connects to ragleap-db using a read-only monitoring role — NOT the
  # app's own credentials. This role does not exist yet in ragleap-ops's
  # db schema and needs to be created there first (real dependency,
  # not yet done — see README "Known open items").
  datasourceSecretName: ragleap-db-exporter-secret
  port: 9187

neo4jExporter:
  # UNVERIFIED — see README "Known open items". Neo4j's own docs and a
  # working xk6-neo4j example show `metrics.prometheus.enabled=true`
  # configured successfully against Neo4j Community 4.4.x. A separate
  # third-party monitoring vendor's compatibility notes claim Community
  # Edition is unsupported for their specific collector. These sources
  # conflict. Do not enable this until live-verified against the real
  # neo4j:5-community image running in this repo's own kind cluster.
  enabled: false
  port: 2004

prometheus:
  enabled: true
  image: prom/prometheus:v3.13.4
  retention: 15d
  scrapeInterval: 30s

# Availability SLO alerts (multi-window burn rate on the Prometheus `up`
# metric). Off by default. This measures whether scraped targets are
# reachable, NOT what users experience: the RagLeap app does not export
# request metrics yet. errorBudget is a placeholder (0.005 = 99.5%), not
# a measured figure. Prometheus keeps 15d by default, so a 30d budget
# window cannot be evaluated directly; the alerts use windows of 6h or less.
# Each job in slo.availability.jobs also gets an absent() alert (RagleapTargetAbsent).
# List only jobs this chart really scrapes, or that alert fires permanently.
slo:
  enabled: false
  availability:
    errorBudget: 0.005
    jobs:
      - ragleap-postgres

grafana:
  enabled: true
  image: grafana/grafana:12.4.15
  # Admin credentials. Never commit real credentials to values.yaml.
  # Preferred: create a Secret yourself (keys admin-user, admin-password)
  # and set existingSecret. Otherwise set password at install time with
  # --set grafana.admin.password=... If both are empty the chart falls back
  # to a placeholder password, which is NOT safe beyond a local test.
  admin:
    existingSecret: ""
    user: admin
    password: ""
  port: 3000

loki:
  enabled: true
  image: grafana/loki:3.6.17
  port: 3100
  retention: 168h   # 7 days -- UNVERIFIED, size for real retention needs

promtail:
  enabled: true
  image: grafana/promtail:3.3.0

# Grafana Alloy log shipper. Grafana has ended Promtail, and Alloy is its
# replacement. Off by default. To switch, set alloy.enabled=true AND
# promtail.enabled=false; running both would ship every log line twice,
# so the chart refuses that combination.
alloy:
  enabled: false
  image: grafana/alloy:v1.20.1
  # Host directory where Alloy keeps its read positions (the only writable host path).
  dataHostPath: /var/lib/ragleap-alloy

alertmanager:
  enabled: true
  image: prom/alertmanager:v0.34.1
  port: 9093
  # No real receiver configured yet -- the default route logs to a
  # webhook receiver pointed at a placeholder URL that will fail
  # every send. This is intentional and stated plainly: AlertManager
  # is wired end-to-end (Prometheus -> AlertManager -> receiver
  # attempt) and alert routing/grouping/silencing all work for real,
  # but nothing will actually notify a human until a real receiver
  # (Slack webhook, email, PagerDuty, etc.) is configured here.
  # Real receivers: both disabled by default, so existing installs keep
  # the placeholder. Secrets are NEVER stored here. Create the Secret
  # yourself in the release namespace, e.g.:
  #   kubectl -n <ns> create secret generic ragleap-alertmanager-secrets \
  #     --from-literal=slack_url='<webhook>' --from-literal=smtp_pass='<pw>'
  # If Secret keys are missing or the Secret is absent, the pod stays in
  # ContainerCreating (a loud failure, not a silent one).
  receivers:
    secretName: ragleap-alertmanager-secrets
    slack:
      enabled: false
      channel: "#alerts"
      secretKey: slack_url
    email:
      enabled: false
      to: ""
      smarthost: ""        # e.g. smtp.gmail.com:587
      from: ""
      username: ""
      secretKey: smtp_pass

# Dedicated zero-permission ServiceAccounts for Prometheus, Grafana, Loki,
# AlertManager and postgres-exporter. Tokens are never mounted. Promtail
# keeps its own ServiceAccount and ClusterRole (it needs pod discovery).
serviceAccount:
  create: true
