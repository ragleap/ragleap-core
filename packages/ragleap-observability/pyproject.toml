[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ragleap-observability"
version = "0.8.5"
description = "Prometheus/Grafana/Loki/AlertManager observability Helm chart for RagLeap Core; the changelog states exactly what each release verified"
readme = "README.md"
keywords = ["observability", "monitoring", "prometheus", "grafana", "loki", "promtail", "alloy", "alertmanager", "alerting", "logging", "kubernetes", "helm", "devops", "rag"]
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "RagLeap Contributors" }
]
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: System :: Systems Administration",
    "Topic :: System :: Monitoring",
]
dependencies = []

[project.urls]
Homepage = "https://packages.ragleap.com/docs/ragleap-observability.html"
Documentation = "https://packages.ragleap.com/docs/ragleap-observability.html"
Source = "https://github.com/ragleap/ragleap-core/tree/main/packages/ragleap-observability"
Changelog = "https://github.com/ragleap/ragleap-core/blob/main/packages/ragleap-observability/CHANGELOG.md"
Issues = "https://github.com/ragleap/ragleap-core/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/ragleap_observability"]

[tool.hatch.build.targets.wheel.force-include]
"helm" = "ragleap_observability/helm"
