[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ragleap-phone"
version = "0.0.0"
description = "Planned: phone calls for RagLeap without a single provider. Package skeleton only (a frame type); no backends, no calls."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Antony", email = "antony@ragleap.com" }]
keywords = ["telephony", "sip", "voice", "open-source"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

# The core stays pure standard library. Backends arrive later as optional extras.
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.0.0"]

[project.urls]
Homepage = "https://github.com/ragleap/ragleap-core"
Repository = "https://github.com/ragleap/ragleap-core"
Issues = "https://github.com/ragleap/ragleap-core/issues"
Documentation = "https://github.com/ragleap/ragleap-core/tree/main/packages/ragleap-phone/docs"

[tool.hatch.build.targets.wheel]
packages = ["src/ragleap_phone"]
