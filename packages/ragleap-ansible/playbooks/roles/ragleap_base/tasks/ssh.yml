---
- name: Refuse to harden ssh without a deploy key
  ansible.builtin.assert:
    that:
      - ragleap_base_deploy_ssh_public_key | length > 0
    fail_msg: "ragleap_base_harden_ssh disables password logins and needs ragleap_base_deploy_ssh_public_key; without a key you would lock yourself out"

- name: Check the root login setting is supported
  ansible.builtin.assert:
    that:
      - ragleap_base_ssh_permit_root_login in ['no', 'prohibit-password']
    fail_msg: ragleap_base_ssh_permit_root_login must be 'no' or 'prohibit-password'

- name: With root login off, the deploy user must be able to use sudo
  ansible.builtin.assert:
    that:
      - ragleap_base_deploy_passwordless_sudo | bool
    fail_msg: ragleap_base_ssh_permit_root_login 'no' needs ragleap_base_deploy_passwordless_sudo, or nobody can administer the server
  when: ragleap_base_ssh_permit_root_login == 'no'

- name: Install openssh-server
  ansible.builtin.apt:
    name: openssh-server
    state: present

- name: Make sure the privilege separation directory exists
  ansible.builtin.file:
    path: /run/sshd
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Apply and check the sshd drop-in
  block:
    - name: Write the sshd drop-in
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/99-ragleap.conf
        content: |
          # Managed by ragleap-ansible
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          PermitRootLogin {{ ragleap_base_ssh_permit_root_login }}
          PubkeyAuthentication yes
        owner: root
        group: root
        mode: "0644"
      notify: Reload sshd

    - name: Check the whole sshd configuration
      ansible.builtin.command: /usr/sbin/sshd -t
      changed_when: false
  rescue:
    - name: Remove the drop-in again
      ansible.builtin.file:
        path: /etc/ssh/sshd_config.d/99-ragleap.conf
        state: absent

    - name: Stop, because the sshd check failed
      ansible.builtin.fail:
        msg: sshd -t rejected the configuration, so the drop-in was removed and sshd was not reloaded
