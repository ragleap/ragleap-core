[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ragleap-ansible"
version = "0.1.2"
description = "Ansible roles that prepare and harden a fresh Ubuntu server: user, sudo, updates, SSH and firewall"
readme = "README.md"
keywords = ["ansible", "devops", "automation", "ubuntu", "k3s", "kubernetes", "helm", "infrastructure-as-code", "rag"]
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "RagLeap Contributors" }
]
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: System :: Systems Administration",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/ragleap/ragleap-core/tree/main/packages/ragleap-ansible"
Documentation = "https://github.com/ragleap/ragleap-core/tree/main/packages/ragleap-ansible"
Source = "https://github.com/ragleap/ragleap-core/tree/main/packages/ragleap-ansible"
Changelog = "https://github.com/ragleap/ragleap-core/blob/main/packages/ragleap-ansible/CHANGELOG.md"
Issues = "https://github.com/ragleap/ragleap-core/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/ragleap_ansible"]

[tool.hatch.build.targets.wheel.force-include]
"playbooks" = "ragleap_ansible/playbooks"
