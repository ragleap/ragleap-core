[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ragleap-optimizer"
version = "0.1.0"
description = "A measure-first layer that reduces token use of LLM requests: token accounting, exact repeated-context removal, bounded tool-output trimming, an exact-match cache that needs a tenant scope, retries and fallback, and an evaluation harness that compares quality before and after. Standard library plus ragleap-security. Every step reports what it changed and whether it can lose information. Not independently audited."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "RagLeap" }
]
keywords = ["llm", "tokens", "cost", "prompt", "cache", "retry", "evaluation", "multi-tenant", "self-hosted"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "ragleap-security>=0.1.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0.0"]

[project.urls]
Homepage = "https://github.com/ragleap/ragleap-core"
Repository = "https://github.com/ragleap/ragleap-core"
Issues = "https://github.com/ragleap/ragleap-core/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/ragleap_optimizer"]
